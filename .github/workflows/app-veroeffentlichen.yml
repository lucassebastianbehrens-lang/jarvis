name: App veröffentlichen
# Die Live-App (GitHub Pages) kommt aus dem Zweig gh-pages.
# Läuft erst, wenn die Qualitätsprüfung grün ist: kopiert genau den geprüften Stand nach gh-pages und prüft die Live-Seite.
on:
  workflow_run:
    workflows: ["Qualitätsprüfung"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Text, der auf der Live-Seite stehen muss'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: app-veroeffentlichen
  cancel-in-progress: false
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: App-Dateien aus main nach gh-pages kopieren
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$SHA"
          for f in index.html sw.js manifest.json icon.svg icon-192.png icon-512.png; do
            git show "$SHA:$f" > "$f"
          done
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          rm -rf css js && git checkout "$SHA" -- css js
          git checkout "$SHA" -- sparen 2>/dev/null || true
          git add -A index.html sw.js manifest.json icon.svg icon-192.png icon-512.png css js sparen
          if git diff --cached --quiet; then echo "gh-pages ist schon aktuell"; else
            git commit -m "App live: geprüfter Stand ${SHA:0:7}"
            for i in 1 2 3; do git push origin HEAD:gh-pages && break; git pull --rebase origin gh-pages; done
          fi
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
      - name: Live-Seite prüfen
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          want=$(git hash-object index.html)
          for i in $(seq 1 40); do
            sleep 15
            curl -fsS -H 'Cache-Control: no-cache' -o live.html "$URL?v=$RANDOM$i" || : > live.html
            live=$(git hash-object live.html)
            echo "Versuch $i: live=$live erwartet=$want"
            if [ "$live" = "$want" ]; then
              if [ -n "$MARKER" ] && ! grep -qF "$MARKER" live.html; then echo "Marker fehlt"; exit 1; fi
              echo "LIVE OK: $URL zeigt die aktuelle App"; exit 0
            fi
          done
          echo "Live-Seite noch nicht aktuell"; exit 1
