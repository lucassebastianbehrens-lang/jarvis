name: Spielgeld-Bot
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spielgeld-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/paper.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Echtgeld (standardmäßig AUS, siehe docs/ECHTGELD.md)
        run: python3 bot/live.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
          KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
          LIVE_MODE: ${{ vars.LIVE_MODE }}
          LIVE_MAX_EUR: ${{ vars.LIVE_MAX_EUR }}
          LIVE_MAX_DAY_LOSS: ${{ vars.LIVE_MAX_DAY_LOSS }}
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/paper.json; [ -f data/live.json ] && git add data/live.json
          git diff --cached --quiet && exit 0
          git commit -qm "Spielgeld-Bot Update"
          git pull -q --rebase origin main && git push -q origin HEAD:main
