name: Spielgeld-Bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spielgeld-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/paper.py
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/paper.json
          git diff --cached --quiet && exit 0
          git commit -qm "Spielgeld-Bot Update"
          git pull -q --rebase origin main && git push -q origin HEAD:main
