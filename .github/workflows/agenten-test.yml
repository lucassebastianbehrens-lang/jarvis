name: Agenten-Test
on:
  workflow_dispatch:
    inputs:
      minuten:
        description: "Testdauer in Minuten"
        default: "60"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Agenten-Bot Live-Test (Spielgeld)
        env:
          AGENTS_OUT: data/agents.json
          MIN: ${{ inputs.minuten }}
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          timeout "${MIN}m" python3 bot/agents.py &
          END=$(( $(date +%s) + MIN*60 + 20 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60
            [ -f data/agents.json ] || continue
            git add data/agents.json
            git diff --cached --quiet && continue
            git commit -qm "Agenten-Test Update"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          done
