name: Leibgarde (Hintergrund-Bots für Lucas)
on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: "Was soll der Bot für dich erledigen?"
        required: true
      id:
        description: "Auftrags-ID (von der App)"
        required: false
      bot:
        description: "Ben, Lea oder Kai"
        required: false
        default: "Ben"
permissions:
  contents: write
# Eigene Warteschlange pro Auftrag: läuft immer sofort, parallel zu allen anderen Bots.
concurrency:
  group: leibgarde-${{ github.run_id }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/hintergrund.py
        env:
          AUFGABE: ${{ inputs.aufgabe }}
          AUFTRAG_ID: ${{ inputs.id || github.run_id }}
          BOT: ${{ inputs.bot }}
          GH_TOKEN: ${{ github.token }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/hintergrund
          git diff --cached --quiet && exit 0
          git commit -qm "Leibgarde: Auftrag erledigt"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*3)); done
