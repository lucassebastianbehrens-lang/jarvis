name: Nacht-Recherche
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: read
concurrency:
  group: recherche
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/recherche.py
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/recherche.json
          git diff --cached --quiet && exit 0
          git commit -qm "Nacht-Recherche Update"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
