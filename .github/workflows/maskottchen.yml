name: Maskottchen erzeugen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 video/mascots.py
      - run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add video/assets && git commit -qm "Maskottchen-Posen" && git pull -q --rebase && git push -q
