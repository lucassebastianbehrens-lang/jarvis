name: Telegram-Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "FEHLT: TG_TOKEN"; exit 1; }
          [ -z "$TG_CHAT" ] && { echo "FEHLT: TG_CHAT"; exit 1; }
          R=$(curl -s -d chat_id="$TG_CHAT" --data-urlencode text="🤖 Jarvis ist verbunden! Ab jetzt bekommst du hier Trades, Tages-Optimierung und Meldungen. (Spielgeld)" "https://api.telegram.org/bot$TG_TOKEN/sendMessage")
          echo "$R" | grep -q '"ok":true' && echo "GESENDET" || { echo "ANTWORT: $(echo "$R" | sed 's/"token[^,]*//g' | head -c 300)"; exit 1; }
