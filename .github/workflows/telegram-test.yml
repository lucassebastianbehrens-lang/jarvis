name: Telegram-Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          t, c = os.environ.get("TG_TOKEN", ""), os.environ.get("TG_CHAT", "").strip()
          api = lambda m, **p: json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{t}/{m}", urllib.parse.urlencode(p).encode() if p else None, timeout=15))
          try:
              me = api("getMe"); print("BOT:", me["result"]["username"])
          except Exception as e:
              print("TOKEN UNGUELTIG:", e); raise SystemExit(1)
          ups = api("getUpdates")["result"]
          ids = sorted({u["message"]["chat"]["id"] for u in ups if "message" in u})
          print("CHATS_DIE_START_GEDRUECKT_HABEN:", len(ids), "| SECRET_PASST:", any(str(i) == c for i in ids), "| SECRET_LAENGE:", len(c), "| NUR_ZIFFERN:", c.lstrip("-").isdigit())
          target = c if any(str(i) == c for i in ids) else (str(ids[0]) if ids else c)
          try:
              api("sendMessage", chat_id=target, text="🤖 Jarvis ist verbunden! Ab jetzt bekommst du hier Trades, Tages-Optimierung und Meldungen (Spielgeld).")
              print("GESENDET an", "Secret" if target == c else "gefundenen Chat")
          except Exception as e:
              print("SENDEN FEHLGESCHLAGEN:", e)
          PY
