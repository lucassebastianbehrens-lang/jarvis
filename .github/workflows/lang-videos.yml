name: Lange YouTube-Videos erzeugen
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Spec-Dateien, z. B. video/long/np-l01-sparplan.json"
        required: true
      stil:
        description: "long = Bilder-Stil, erklaer = Maskottchen-Erklärstil"
        default: "long"
      fotos:
        description: "1 = schnell mit gemeinfreien Fotos statt KI-Bildern"
        default: ""
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q edge-tts
      - run: pip install -q pillow cairosvg
      - run: python3 video/${{ inputs.stil || 'long' }}.py ${{ inputs.specs }}
        env:
          FOTOS: ${{ inputs.fotos }}
      - name: Als Release zum Herunterladen ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="youtube-$(date +%Y%m%d-%H%M)-${{ github.run_id }}"
          cd video/out
          shopt -s nullglob; F=(*.mp4 *.jpg *.srt *.txt); gh release create "$TAG" "${F[@]}" --title "YouTube-Videos $(date +%d.%m.%Y)" \
            --notes "Fertige YouTube-Videos. Pro Video: .mp4 (Video), -thumbnail.jpg, .srt (Untertitel), .txt (Titel, Beschreibung, Tags)."
