name: Automaton (Überleben + Klonen, PayPal)
# Jarvis' eigener Topf: liest PayPal (nur lesen!), setzt die Überlebens-Stufe, lässt Kind-Bots arbeiten, schlägt Klone vor.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      aktion:
        description: "lauf, ja (Klon-Vorschlag annehmen) oder nein (ablehnen)"
        required: false
        default: "lauf"
permissions:
  contents: write
  actions: write   # Kind-Bots starten Shop-Bau / Videos
concurrency:
  group: automaton
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/automaton.py "${{ inputs.aktion || 'lauf' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/automaton.json
          git diff --cached --quiet && exit 0
          git commit -qm "Automaton: Herzschlag"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*3)); done
