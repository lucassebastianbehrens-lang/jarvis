name: API-Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://lucassebastianbehrens-lang.github.io"
          for u in "https://de.wikipedia.org/w/api.php?action=query&list=search&srsearch=Oschersleben&format=json&origin=*" \
                   "https://www.tagesschau.de/api2u/search/?searchText=Bitcoin&pageSize=3" \
                   "https://r.jina.ai/https://example.com" \
                   "https://image.pollinations.ai/prompt/red%20car?width=256&height=256&nologo=true" \
                   "https://api.duckduckgo.com/?q=Bitcoin&format=json&no_html=1"; do
            echo "== $u"; curl -s -m 60 -o /tmp/b -D - -H "$O" "$u" | grep -i -E "^HTTP|access-control-allow-origin|^content-type|^location"; head -c 200 /tmp/b | tr -d '\0' | tr '\n' ' '; echo
          done
