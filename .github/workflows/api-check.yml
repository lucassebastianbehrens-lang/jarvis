name: API-Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -D - "https://www.tagesschau.de/api2u/homepage/" | grep -i -E "^HTTP|^location"
          curl -sL -o /tmp/n.json -D - -H "Origin: https://lucassebastianbehrens-lang.github.io" "https://www.tagesschau.de/api2u/homepage/" | grep -i -E "^HTTP|access-control-allow-origin|^location"
          python3 -c "import json;d=json.load(open('/tmp/n.json'));print('TITEL',[n.get('title') for n in d.get('news',[])][:3])"
