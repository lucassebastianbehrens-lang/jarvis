name: API-Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://lucassebastianbehrens-lang.github.io"
          B='{"model":"openai","messages":[{"role":"user","content":"Sag nur: Bereit."}]}'
          for u in https://text.pollinations.ai/openai https://text.pollinations.ai/openai/chat/completions https://gen.pollinations.ai/v1/chat/completions; do
            echo "== POST $u"; curl -s -m 60 -D /tmp/h -o /tmp/b -H "$O" -H "Content-Type: application/json" -d "$B" "$u"; grep -i -E "^HTTP|access-control-allow-origin" /tmp/h; head -c 300 /tmp/b; echo
          done
          echo "== OPTIONS"; curl -s -m 30 -X OPTIONS -D - -o /dev/null -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization" https://text.pollinations.ai/openai | grep -i -E "^HTTP|access-control"
          echo "== MODELS"; curl -s -m 30 https://text.pollinations.ai/models | head -c 600; echo
