name: Ideen-Eingang (Telegram)
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ideen
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/ideen.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/ideen.json data/tg_offset.json
          git diff --cached --quiet && exit 0
          git commit -qm "Ideen-Eingang Update"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
