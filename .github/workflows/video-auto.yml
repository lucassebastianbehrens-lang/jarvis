name: Jarvis macht TikTok-Videos selbst
# VORRAT: Jarvis hält für Simulation und Früchte-Serie immer 7 Tage fertig geprüfte Videos bereit
# (Release „jarvis-video-<Tag>-<modus>“ je Tag). Die Upload-Aufgaben holen sich abends das Video des Tages.
# Täglich: Groq-KI schreibt die Folge, GitHub rendert, Jarvis prüft automatisch und schickt das Video per Telegram.
# Die Claude-Aufgaben laden danach nur noch hoch (spart Claude-Nutzung). Braucht das Secret GROQ_KEY.
# GitHub lässt geplante Läufe oft ausfallen → je Video 4 Termine; schon erledigt (Release von heute da) = übersprungen.
on:
  schedule:
    - cron: "7 4,6,9,13 * * *"    # Simulation: 05:07 / 07:07 / 10:07 / 14:07 Berlin (Ersatztermine)
    - cron: "37 5,8,11,15 * * *"  # Früchte-Serie: 06:37 / 09:37 / 12:37 / 16:37 Berlin (Ersatztermine)
    - cron: "52 6,10,14,17 * * *" # Kontostand-Serie: 07:52 / 11:52 / 15:52 / 18:52 Berlin (Ersatztermine)
    - cron: "22 7,11,15,18 * * *" # Zeichentrick „Stell dir vor“: 08:22 / 12:22 / 16:22 / 19:22 Berlin (Ersatztermine)
  workflow_dispatch:
    inputs:
      modus:
        description: "sim, tt, geld oder zt (Zeichentrick)"
        default: "sim"
      idee:
        description: "Optional: eigene Idee für ein Simulations-Video (z. B. „Duschen vs Baden – wer spart mehr Wasser?“)"
        default: ""
      spec:
        description: "Optional: fertige Folge nur rendern statt neu schreiben (z. B. video/geld/geld-s1-f01.json)"
        default: ""
      tage:
        description: "Wie viele Tage im Voraus fertig haben (Vorrat). 7 = eine Woche"
        default: "7"
      neu:
        description: "1 = vorhandene Vorrats-Videos mit aktueller Grafik neu rendern"
        default: "0"
permissions:
  contents: write
concurrency:  # je Serie eigene Warteschlange (Simulation und Früchte-Serie bauen parallel)
  group: video-auto-${{ inputs.modus || github.event.schedule || 'x' }}
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      IDEE: ${{ inputs.idee }}
      GH_TOKEN: ${{ github.token }}
      MODUS: ${{ inputs.modus || (github.event.schedule == '7 4,6,9,13 * * *' && 'sim' || (github.event.schedule == '52 6,10,14,17 * * *' && 'geld' || (github.event.schedule == '22 7,11,15,18 * * *' && 'zt' || 'tt'))) }}
    steps:
      - uses: actions/checkout@v4
      - name: Welche Tage fehlen noch im Vorrat?
        id: key
        run: |
          if [ -z "$GROQ_KEY$GEMINI_KEY$OPENROUTER_KEY" ]; then echo "Kein KI-Schlüssel – übersprungen"; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          N="${{ inputs.tage }}"; [ -z "$N" ] && N=7; [ "$MODUS" = geld ] && [ -z "${{ inputs.tage }}" ] && N=1
          [ -n "${{ inputs.spec }}" ] && N=1
          FEHLT=""
          for i in $(seq 0 $((N - 1))); do
            D=$(TZ=Europe/Berlin date -d "+$i day" +%Y%m%d)
            if [ "${{ inputs.neu }}" = 1 ]; then FEHLT="$FEHLT $D"; else
              gh release view "jarvis-video-$D-$MODUS" >/dev/null 2>&1 || FEHLT="$FEHLT $D"; fi
          done
          echo "Fehlende Tage ($MODUS):${FEHLT:- keine}"
          echo "tage=$FEHLT" >> $GITHUB_OUTPUT
          [ -n "$FEHLT" ] && echo "ok=1" >> $GITHUB_OUTPUT || echo "ok=0" >> $GITHUB_OUTPUT
      - if: steps.key.outputs.ok == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q edge-tts pillow cairosvg numpy
      - name: Videos für die fehlenden Tage bauen (je 3-fach geprüft)
        if: steps.key.outputs.ok == '1'
        id: bau
        env:
          SPEC_IN: ${{ inputs.spec }}
          NEU: ${{ inputs.neu }}
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          mkdir -p video/out; FEHLER=0
          for D in ${{ steps.key.outputs.tage }}; do
            if ! bash bot/video_tag.sh "$MODUS" "$D" "$SPEC_IN"; then
              FEHLER=$((FEHLER + 1)); echo "⚠️ $D nicht geschafft"
              # Serien (Früchte, Kontostand) nur der Reihe nach füllen, sonst stimmt die Folgen-Reihenfolge nicht mehr
              [ "$MODUS" != sim ] && break
            fi
            SPEC_IN=""; IDEE=""
            find video/out -mindepth 1 -maxdepth 1 ! -name fertig.txt -exec rm -rf {} +   # Platz für das nächste Video
            sleep 45   # Groq-Gratislimit schonen
          done
          echo "fehler=$FEHLER" >> $GITHUB_OUTPUT
          [ -s video/out/fertig.txt ] || exit 1
      - name: Telegram
        if: always() && steps.key.outputs.ok == '1'
        run: |
          NAME=$(case "$MODUS" in sim) echo "Simulation";; tt) echo "Früchte-Serie";; zt) echo "Zeichentrick";; *) echo "Kontostand";; esac)
          if [ -s video/out/fertig.txt ]; then
            T="🎬 Vorrat $NAME: $(wc -l < video/out/fertig.txt) neue Videos fertig + geprüft
          $(sed 's/^/• /' video/out/fertig.txt)"
            [ "${{ steps.bau.outputs.fehler }}" != "0" ] && T="$T
          ⚠️ ${{ steps.bau.outputs.fehler }} Tag(e) nicht geschafft – nächster Lauf versucht es erneut."
          else
            T="⚠️ Vorrat $NAME: heute kein Video geschafft – nächster Lauf versucht es erneut."
          fi
          curl -s --form-string chat_id="$TG_CHAT" --form-string text="$T" "https://api.telegram.org/bot$TG_TOKEN/sendMessage" >/dev/null || true
