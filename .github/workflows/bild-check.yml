name: Bild-Prüfung (Video)
# Prüft ein fertiges Video (Release-Link) mit Bilderkennung auf Menschen/Freizügiges. Rot = nicht posten.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Download-Link der .mp4 (GitHub-Release)"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: curl -fsSL -o video.mp4 "${{ inputs.url }}" && python3 bot/bild_check.py video.mp4
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
